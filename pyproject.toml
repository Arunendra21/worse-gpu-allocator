[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worse-gpu-allocator"
version = "0.9.0"
description = "A deliberately bad, dependency-free GPU memory allocator simulator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "A Worse GPU Memory Allocator contributors" }]
keywords = ["gpu", "cuda", "memory", "allocator", "education", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/eeshsaxena/worse-gpu-allocator"
Repository = "https://github.com/eeshsaxena/worse-gpu-allocator"
Issues = "https://github.com/eeshsaxena/worse-gpu-allocator/issues"

[project.optional-dependencies]
dev = ["mypy==2.3.0", "ruff==0.16.1"]

[project.scripts]
worse-gpu-demo = "demo:main"
worse-gpu-benchmark = "benchmark:main"

[tool.setuptools]
py-modules = ["benchmark", "demo", "worse_gpu_allocator"]
